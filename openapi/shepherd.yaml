                  agent_model: opus-5
                  session_id: sess-20260906-abc123
                started_at: "2026-09-06T10:10:00Z"
                ended_at: "2026-09-06T12:15:00Z"
                outcome: succeeded
                failure_reason: null
                summary: Implemented lifecycle state machine.
                decisions:
                  - Use a state-transition table.
                knowledge_items: []
                artifacts:
