# ════════════════════════════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════════════════════════════

components:
  # ── Security schemes ─────────────────────────────────────────────────

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Owner or agent bearer token: 32 random bytes, base64url, issued at
        bootstrap (owner-token file) or by createAgent. Opaque, not JWT.
        See plan/12-security-and-local-identity.md.
    ownerSession:
      type: apiKey
      in: cookie
      name: shepherd_session
      description: >-
        Owner browser session cookie issued by createBrowserSession.
        Cookie-authenticated mutations also require X-CSRF-Token.

  # ── Reusable headers ─────────────────────────────────────────────────

  headers:
    Access-Control-Allow-Origin:
      description: CORS allowed origin.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 500
        pattern: "^[\\x20-\\x7E]+$"

  # ── Reusable responses ───────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Authentication required or invalid token.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:unauthorized"
            title: Unauthorized
            status: 401
            detail: A valid bearer token is required.

    ValidationError:
      description: Request body or parameters failed validation.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:validation-error"
            title: Validation Error
            status: 422
            detail: One or more fields failed validation.
            errors:
              - field: /title
                message: must be at least 1 character
                code: min_length

    InternalError:
      description: Unexpected server error.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:internal-error"
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.

  # ── Schemas ──────────────────────────────────────────────────────────

  schemas:
    # ─── System ──────────────────────────────────────────────────────

    Health:
      type: object
      description: >-
        Service health report per draft-inadarei-api-health-check-06.
        Content-Type: application/health+json.
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: >-
            Service status. `pass` = healthy, `warn` = healthy with
            concerns, `fail` = unhealthy.
          enum:
            - pass
            - warn
            - fail
        version:
          type: string
          description: Public version of the service (SemVer).
          minLength: 5
          maxLength: 20
          pattern: "^\\d+\\.\\d+\\.\\d+(-[a-z0-9.]+)?$"
        description:
          type: string
          description: Human-friendly description of the service.
          minLength: 1
          maxLength: 500
          pattern: "^\\S[\\s\\S]*$"
        output:
          type: string
          description: >-
            Raw error output for unhealthy status. Present only when
            status is `fail` or `warn`.
          minLength: 1
          maxLength: 5000
          pattern: "^[\\s\\S]+$"
        notes:
          type: array
          description: Informational notes about the service.
          minItems: 0
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2000
            pattern: "^[\\s\\S]+$"

    # ─── Error model (RFC 9457) ──────────────────────────────────────

    ProblemDetail:
      type: object
      description: >-
        RFC 9457 problem detail. Every error response uses this shape with a
        stable URN type slug for machine-readable identification.
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: >-
            Stable URN identifying the error type. Machine-readable.
          minLength: 10
          maxLength: 100
          pattern: "^urn:shepherd:error:[a-z][a-z0-9-]+$"
        title:
          type: string
          description: Short human-readable summary of the error.
          minLength: 1
          maxLength: 100
          pattern: "^\\S[\\s\\S]*$"
        status:
          type: integer
          description: HTTP status code.
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          minLength: 1
          maxLength: 2000
          pattern: "^[\\s\\S]+$"
        instance:
          type: string
          description: URI identifying this specific occurrence.
          minLength: 1
          maxLength: 500
          pattern: "^[\\x20-\\x7E]+$"
        errors:
          type: array
          description: Detailed validation errors (present on 422 responses).
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

    ValidationErrorDetail:
      type: object
      description: A single field-level validation error.
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: JSON Pointer to the invalid field.
          minLength: 1
          maxLength: 200
          pattern: "^/[a-zA-Z0-9_/]+$"
        message:
          type: string
          description: Human-readable error message.
          minLength: 1
          maxLength: 500
          pattern: "^[\\s\\S]+$"
        code:
          type: string
          description: Machine-readable error code.
          minLength: 1
          maxLength: 50
          pattern: "^[a-z][a-z0-9_]+$"

    # ─── Identity (plan/12, step 007) ────────────────────────────────

    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          maxLength: 200
          description: >-
            Type. Exact semantics are specified in plan/03-domain-model.md and
            plan/04-workflow-state-machines.md.
        title:
          type: string
          maxLength: 200
          description: >-
            Title. Exact semantics are specified in plan/03-domain-model.md and
            plan/04-workflow-state-machines.md.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: >-
            Status. Exact semantics are specified in plan/03-domain-model.md and
            plan/04-workflow-state-machines.md.
          format: int32
        code:
          type: string
          maxLength: 80
          description: >-
            Code. Exact semantics are specified in plan/03-domain-model.md and
            plan/04-workflow-state-machines.md.
