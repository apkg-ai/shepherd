openapi: 3.1.0
info:
  title: shepherd API
  description: >-
    Health-only scaffold contract for the shepherd daemon. This is step 000
    of the stable-v1 plan: the spec is the product boundary — anything not
    in this contract does not exist. Later steps replace it with the full
    v1 surface; the authoritative contracts live in plan/contracts/.
  version: 0.1.0
  contact:
    name: apkg
    url: https://github.com/apkg-ai/shepherd
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://localhost:7437
    description: >-
      Local daemon (default port 7437, override with --port or
      SHEPHERD_PORT). v1 runs plain HTTP on localhost; TLS is a
      post-v1 concern (F4).
    x-internal: true

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health and service metadata.

# ════════════════════════════════════════════════════════════════════════
# Paths
# ════════════════════════════════════════════════════════════════════════

paths:
  # ── System ───────────────────────────────────────────────────────────

  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Service health check
      description: >-
        Liveness probe per draft-inadarei-api-health-check-06. Returns 200
        with status `pass` while healthy, 503 with status `fail` when
        degraded. Content-Type: application/health+json.
      security:
        - {}
      responses:
        "200":
          description: Service is healthy (status pass or warn).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: pass
                version: 0.1.0
                description: shepherd local daemon
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Service is unhealthy (status fail).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "urn:shepherd:error:service-unavailable"
                title: Service Unavailable
                status: 503
                detail: Health check failed.

# ════════════════════════════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════════════════════════════

components:
  # ── Security schemes ─────────────────────────────────────────────────

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Placeholder for future authentication. v1 runs on localhost without
        auth enforcement; see plan/12-security-and-local-identity.md for
        the auth roadmap. Tokens will follow RFC8725 JSON Web Token Best
        Current Practices.

  # ── Reusable headers ─────────────────────────────────────────────────

  headers:
    RateLimit-Limit:
      description: Maximum number of requests allowed in the current window.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100000
    RateLimit-Remaining:
      description: Number of requests remaining in the current window.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
    RateLimit-Reset:
      description: Seconds until the current rate-limit window resets.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
    Retry-After:
      description: Seconds to wait before retrying after a 429 response.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
    Access-Control-Allow-Origin:
      description: CORS allowed origin.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 500
        pattern: "^[\\x20-\\x7E]+$"

  # ── Reusable responses ───────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Authentication required or invalid token.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:unauthorized"
            title: Unauthorized
            status: 401
            detail: A valid bearer token is required.

    ValidationError:
      description: Request body or parameters failed validation.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:validation-error"
            title: Validation Error
            status: 422
            detail: One or more fields failed validation.
            errors:
              - field: /title
                message: must be at least 1 character
                code: min_length

    InternalError:
      description: Unexpected server error.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:internal-error"
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.

    TooManyRequests:
      description: Rate limit exceeded. Retry after the indicated delay.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "urn:shepherd:error:rate-limit-exceeded"
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded. Try again in 60 seconds.

  # ── Schemas ──────────────────────────────────────────────────────────

  schemas:
    # ─── System ──────────────────────────────────────────────────────

    Health:
      type: object
      description: >-
        Service health report per draft-inadarei-api-health-check-06.
        Content-Type: application/health+json.
      additionalProperties: false
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: >-
            Service status. `pass` = healthy, `warn` = healthy with
            concerns, `fail` = unhealthy.
          enum:
            - pass
            - warn
            - fail
        version:
          type: string
          description: Public version of the service (SemVer).
          minLength: 5
          maxLength: 20
          pattern: "^\\d+\\.\\d+\\.\\d+(-[a-z0-9.]+)?$"
        description:
          type: string
          description: Human-friendly description of the service.
          minLength: 1
          maxLength: 500
          pattern: "^\\S[\\s\\S]*$"
        output:
          type: string
          description: >-
            Raw error output for unhealthy status. Present only when
            status is `fail` or `warn`.
          minLength: 1
          maxLength: 5000
          pattern: "^[\\s\\S]+$"
        notes:
          type: array
          description: Informational notes about the service.
          minItems: 0
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2000
            pattern: "^[\\s\\S]+$"

    # ─── Error model (RFC 9457) ──────────────────────────────────────

    ProblemDetail:
      type: object
      description: >-
        RFC 9457 problem detail. Every error response uses this shape with a
        stable URN type slug for machine-readable identification.
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: >-
            Stable URN identifying the error type. Machine-readable.
          minLength: 10
          maxLength: 100
          pattern: "^urn:shepherd:error:[a-z][a-z0-9-]+$"
        title:
          type: string
          description: Short human-readable summary of the error.
          minLength: 1
          maxLength: 100
          pattern: "^\\S[\\s\\S]*$"
        status:
          type: integer
          description: HTTP status code.
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          minLength: 1
          maxLength: 2000
          pattern: "^[\\s\\S]+$"
        instance:
          type: string
          description: URI identifying this specific occurrence.
          minLength: 1
          maxLength: 500
          pattern: "^[\\x20-\\x7E]+$"
        errors:
          type: array
          description: Detailed validation errors (present on 422 responses).
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

    ValidationErrorDetail:
      type: object
      description: A single field-level validation error.
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: JSON Pointer to the invalid field.
          minLength: 1
          maxLength: 200
          pattern: "^/[a-zA-Z0-9_/]+$"
        message:
          type: string
          description: Human-readable error message.
          minLength: 1
          maxLength: 500
          pattern: "^[\\s\\S]+$"
        code:
          type: string
          description: Machine-readable error code.
          minLength: 1
          maxLength: 50
          pattern: "^[a-z][a-z0-9_]+$"
