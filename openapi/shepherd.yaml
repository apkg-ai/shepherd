    post:
      operationId: createTaskSession
      tags:
        - sessions
      summary: Report a work session
      description: >-
        Records a completed work session on a task. The task must be
        `in_progress` and claimed by the reporting identity — a mismatched
        identity is rejected with 409 Conflict; a missing or expired claim
        with 410 Gone. On success the task advances: `in_review` if the
        project review gate is on, `done` if it is off. On failure, the
        task returns to `ready` and its attempt count increments.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionReport"
            example:
              identity:
                harness: claude-code
                agent_model: opus-5
                session_id: sess-20260906-abc123
                label: S3 domain core
              started_at: "2026-09-06T10:10:00Z"
              ended_at: "2026-09-06T12:15:00Z"
              outcome: succeeded
              summary: >-
                Implemented lifecycle state machine with all transitions from
                02-domain-model.md. Added proptest suite for acyclicity and
                transition invariants.
              decisions:
                - Use a state-transition table rather than match arms.
                - >-
                  Represent blocked as a flag on the task, not a status — any
                  status can be blocked.
              knowledge_items:
                - type: decision
                  title: State-transition table design
                  content: >-
                    Lifecycle transitions are encoded as a static lookup table
                    indexed by (current_status, trigger). This makes adding
                    transitions declarative and testable.
              artifacts:
                - https://github.com/apkg-ai/shepherd/pull/25
      responses:
        "201":
          description: Session recorded and task advanced.
          headers:
