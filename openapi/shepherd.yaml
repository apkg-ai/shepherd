    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: claimTask
      tags:
        - claims
      summary: Claim a task
      description: >-
        Acquires a lease-based claim on a task. The task must be `ready` and
        unclaimed. The caller provides their identity and a TTL; the task
        transitions to `in_progress`. At most one active claim per task;
        concurrent attempts result in exactly one winner. Expired leases
        release the task back to `ready` automatically.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
            example:
              identity:
                harness: claude-code
                agent_model: opus-5
                session_id: sess-20260906-abc123
                label: S3 domain core
              ttl_seconds: 600
      responses:
        "201":
          description: Claim acquired.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
