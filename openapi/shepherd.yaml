                  harness: claude-code
                  agent_model: opus-5
                  session_id: sess-20260906-abc123
                  label: S3 domain core
                ttl_seconds: 600
                lease_id: lease-019263a0-abcd
                acquired_at: "2026-09-06T10:10:00Z"
                expires_at: "2026-09-06T10:20:00Z"
