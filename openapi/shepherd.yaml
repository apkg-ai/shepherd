openapi: 3.1.0
info:
  title: shepherd API
  description: >-
    Local-first hub for agent-driven project work. Maps projects as typed task
    graphs and acts as persistent shared memory across agent and human sessions.
    The spec is the product boundary — anything not in this contract does not
    exist. Design rules in docs/03-api.md.
  version: 0.1.0
  contact:
    name: apkg
    url: https://github.com/apkg-ai/shepherd
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://localhost:7437
    description: >-
      Local daemon (default port 7437, override with --port or
      SHEPHERD_PORT). v1 runs plain HTTP on localhost; TLS is a
      post-v1 concern (F4).
    x-internal: true

security:
  - bearerAuth: []

tags:
  - name: claims
    description: Lease-based task claims — acquire, renew, release.
  - name: events
    description: Server-Sent Events stream for real-time domain updates.
  - name: export-import
    description: Versioned JSON export and import of projects.
  - name: knowledge
    description: Typed, reusable information items attached to tasks or projects.
  - name: projects
    description: Top-level project resources — CRUD and settings.
  - name: relations
    description: >-
      Decomposition (parent/child) and dependency (depends_on) edges between
      tasks. The dependency graph is always acyclic.
  - name: sessions
    description: Structured work episodes reported against a task.
  - name: system
    description: Health and service metadata.
  - name: tasks
    description: >-
      Units of work within a project — typed, positioned in the graph, driven
      through the lifecycle state machine.

# ════════════════════════════════════════════════════════════════════════
# Paths
# ════════════════════════════════════════════════════════════════════════

paths:
  # ── System ───────────────────────────────────────────────────────────

  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Service health check
      description: >-
        Liveness probe per draft-inadarei-api-health-check-06. Returns 200
        with status `pass` while healthy, 503 with status `fail` when
        degraded. Content-Type: application/health+json.
      security:
        - {}
      responses:
        "200":
          description: Service is healthy (status pass or warn).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: pass
                version: 0.1.0
                description: shepherd local daemon
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Service is unhealthy (status fail).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "urn:shepherd:error:service-unavailable"
                title: Service Unavailable
                status: 503
                detail: Health check failed.

  # ── Projects ─────────────────────────────────────────────────────────

  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
        - projects
      summary: List all projects
      description: >-
        Returns a paginated list of all registered projects, ordered by
        creation date descending.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated project list.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
              example:
                items:
                  - id: 019263a0-1234-7def-8000-000000000001
                    name: shepherd
                    description: Local-first hub for agent-driven project work.
                    settings:
                      review_gate: true
                    created_at: "2026-09-06T10:00:00Z"
                    updated_at: "2026-09-06T10:00:00Z"
                has_more: false
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createProject
      tags:
        - projects
      summary: Register a new project
      description: >-
        Creates a project with the given name and optional settings. The
        review gate defaults to true (agent work requires human approval).
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
            example:
              name: shepherd
              description: Local-first hub for agent-driven project work.
              settings:
                review_gate: true
      responses:
        "201":
          description: Project created.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 019263a0-1234-7def-8000-000000000001
                name: shepherd
                description: Local-first hub for agent-driven project work.
                settings:
                  review_gate: true
                created_at: "2026-09-06T10:00:00Z"
                updated_at: "2026-09-06T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags:
        - projects
      summary: Get a project by ID
      description: Returns the full project resource including settings.
      security:
        - {}
      responses:
        "200":
          description: Project found.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 019263a0-1234-7def-8000-000000000001
                name: shepherd
                description: Local-first hub for agent-driven project work.
                settings:
                  review_gate: true
                created_at: "2026-09-06T10:00:00Z"
                updated_at: "2026-09-06T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateProject
      tags:
        - projects
      summary: Update a project
      description: >-
        Partially updates a project. Only the provided fields are changed.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 019263a0-1234-7def-8000-000000000001
                name: shepherd
                description: Local-first hub for agent-driven project work.
                settings:
                  review_gate: true
                created_at: "2026-09-06T10:00:00Z"
                updated_at: "2026-09-06T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteProject
      tags:
        - projects
      summary: Delete a project
      description: >-
        Permanently deletes a project and all its tasks, relations, sessions,
        and knowledge items. This action is irreversible.
      security:
        - {}
      responses:
        "204":
          description: Project deleted.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Export / Import ──────────────────────────────────────────────────

  /api/v1/projects/{project_id}/export:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: exportProject
      tags:
        - export-import
      summary: Export a project as a versioned JSON document
      description: >-
        Returns a self-contained JSON document containing the project and all
        its tasks, relations, sessions, and knowledge items. The document
        carries its own schema version for forward compatibility.
      security:
        - {}
      responses:
        "200":
          description: Export document.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDocument"
              example:
                version: "1.0.0"
                project:
                  id: 019263a0-1234-7def-8000-000000000001
                  name: shepherd
                  description: Local-first hub.
                  settings:
                    review_gate: true
                  created_at: "2026-09-06T10:00:00Z"
                  updated_at: "2026-09-06T10:00:00Z"
                tasks: []
                relations: []
                sessions: []
                knowledge: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/import:
    post:
      operationId: importProject
      tags:
        - export-import
      summary: Import a project from an export document
      description: >-
        Creates a new project from a previously exported document. Import
        always creates a new project — no merge semantics in v1. The schema
        version in the document must be compatible with this server.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDocument"
      responses:
        "201":
          description: Project imported.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
              example:
                project_id: 019263a0-1234-7def-8000-000000000002
                task_count: 15
                relation_count: 14
                session_count: 3
                knowledge_count: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Tasks ────────────────────────────────────────────────────────────

  /api/v1/projects/{project_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listTasks
      tags:
        - tasks
      summary: List tasks in a project
      description: >-
        Returns a paginated list of tasks, optionally filtered by status
        and/or type.
      security:
        - {}
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/TypeFilter"
      responses:
        "200":
          description: Paginated task list.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
              example:
                items:
                  - id: 019263a0-1234-7def-8000-000000000010
                    project_id: 019263a0-1234-7def-8000-000000000001
                    title: Implement lifecycle state machine
                    description: Full state machine for task transitions.
                    type: code
                    status: ready
                    metadata: {}
                    assignee: null
                    graph_role: []
                    attempt_count: 0
                    created_at: "2026-09-06T10:05:00Z"
                    updated_at: "2026-09-06T10:05:00Z"
                has_more: false
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTask
      tags:
        - tasks
      summary: Create a task
      description: >-
        Creates a task in the project. When created with status `proposed`,
        the task requires human approval before becoming actionable. When
        created with status `approved`, the task proceeds directly to `ready`
        once its dependencies (if any) are satisfied.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
            example:
              title: Implement context-bundle assembly
              description: >-
                Assemble the context bundle returned on task claim — task
                details, dependency summaries, project knowledge, and
                sibling awareness.
              type: code
              status: proposed
              metadata:
                priority: high
                estimated_hours: 2
      responses:
        "201":
          description: Task created.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 019263a0-1234-7def-8000-000000000010
                project_id: 019263a0-1234-7def-8000-000000000001
                title: Implement lifecycle state machine
                description: Full state machine for task transitions.
                type: code
                status: ready
                metadata: {}
                assignee: null
                graph_role: []
                attempt_count: 0
                created_at: "2026-09-06T10:05:00Z"
                updated_at: "2026-09-06T10:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{project_id}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags:
        - tasks
      summary: Get a task by ID
      description: Returns the full task resource including metadata and status.
      security:
        - {}
      responses:
        "200":
          description: Task found.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 019263a0-1234-7def-8000-000000000010
                project_id: 019263a0-1234-7def-8000-000000000001
                title: Implement lifecycle state machine
                description: Full state machine for task transitions.
                type: code
                status: ready
                metadata: {}
                assignee: null
                graph_role: []
                attempt_count: 0
                created_at: "2026-09-06T10:05:00Z"
                updated_at: "2026-09-06T10:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateTask
      tags:
        - tasks
      summary: Update a task
      description: >-
        Partially updates a task. Only the provided fields are changed. Status
        transitions are not performed via this endpoint — use the dedicated
        approve, reject, claim, and session-report endpoints.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 019263a0-1234-7def-8000-000000000010
                project_id: 019263a0-1234-7def-8000-000000000001
                title: Implement lifecycle state machine
                description: Full state machine for task transitions.
                type: code
                status: ready
                metadata: {}
                assignee: null
                graph_role: []
                attempt_count: 0
                created_at: "2026-09-06T10:05:00Z"
                updated_at: "2026-09-06T10:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteTask
      tags:
        - tasks
      summary: Delete a task
      description: >-
        Permanently deletes a task and all its relations, sessions, and
        knowledge items. This action is irreversible.
      security:
        - {}
      responses:
        "204":
          description: Task deleted.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Task actions ─────────────────────────────────────────────────────

  /api/v1/projects/{project_id}/tasks/{task_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: approveTask
      tags:
        - tasks
      summary: Approve a proposed task
      description: >-
        Approves a proposal or work in review. A `proposed` task transitions
        to `approved` (then to `ready` automatically once all its
        `depends_on` dependencies are `done`). An `in_review` task
        transitions to `done`, readying its dependents.
      security:
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Task approved.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 019263a0-1234-7def-8000-000000000010
                project_id: 019263a0-1234-7def-8000-000000000001
                title: Implement lifecycle state machine
                description: Full state machine for task transitions.
                type: code
                status: ready
                metadata: {}
                assignee: null
                graph_role: []
                attempt_count: 0
                created_at: "2026-09-06T10:05:00Z"
                updated_at: "2026-09-06T10:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{project_id}/tasks/{task_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: rejectTask
      tags:
        - tasks
      summary: Reject a task in review
      description: >-
        Rejects a task that is `in_review`, returning it to `ready` so it
        can be claimed again. The task keeps its full attempt history.
      security:
        - {}
      requestBody:
