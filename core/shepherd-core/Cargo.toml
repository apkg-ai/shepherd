[package]
name = "shepherd-core"
description = "shepherd domain core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes TestClock and the deliberately insecure idempotency test codec to integration tests.
test-support = []

[dependencies]
base64 = "=0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
subtle = "=2.6.1"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
shepherd-core = { path = ".", features = ["test-support"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.26.1", features = ["v7"] }
