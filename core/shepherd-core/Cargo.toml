[package]
name = "shepherd-core"
description = "shepherd domain core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes TestClock and the deliberately insecure idempotency test codec to integration tests.
test-support = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
shepherd-core = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
