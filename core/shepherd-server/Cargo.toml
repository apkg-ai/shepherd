[package]
name = "shepherd-server"
description = "shepherd daemon: axum routing and static UI serving (v1 scaffold)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
http-body-util = "0.1"
# 0.49 is pinned by the generated validation layer (REQUIRED_DEPS.toml).
jsonschema = { version = "0.49", default-features = false }
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
shepherd-core = { path = "../shepherd-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }

[dev-dependencies]
# Contract tests validate live responses against the spec with the newer
# jsonschema API (Validator::new + iter_errors); the generated runtime layer
# stays on 0.49, hence the alias to have both in the same build.
jsonschema_055 = { package = "jsonschema", version = "0.55" }
serde_yaml = "0.9"
# Boot and static-serving tests need throwaway directories: a fake HOME to
# prove the server never touches ~/.shepherd, and a ui-dist stand-in.
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
