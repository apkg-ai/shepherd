[package]
name = "shepherd-server"
description = "shepherd daemon: axum routing, SSE fan-out, static UI serving"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6"
http-body-util = "0.1"
# 0.49 is pinned by the generated validation layer (REQUIRED_DEPS.toml).
jsonschema = { version = "0.49", default-features = false }
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7"
shepherd-core = { path = "../shepherd-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
# Contract tests validate live responses against the spec with the newer
# jsonschema API (Validator::new + iter_errors); the generated runtime layer
# stays on 0.49, hence the alias to have both in the same build.
jsonschema_055 = { package = "jsonschema", version = "0.55" }
serde_yaml = "0.9"
# Concurrency tests need a file-backed store: the in-memory pool is a single
# connection, which serializes writes and hides claim races.
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
