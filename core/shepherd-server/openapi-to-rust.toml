[generator]
spec_path = "../../openapi/shepherd.yaml"
output_dir = "src/generated"
module_name = "shepherd"

[features]
enable_async_client = false

[generator.types]
date_time = "chrono"
uuid = "uuid"

[server]
framework = "axum"
operations = [
    "getHealth",
    "createBrowserSession",
    "getBrowserSession",
    "deleteBrowserSession",
    "listAgents",
    "createAgent",
    "revokeAgent",
    "getPrincipal",
    "listProjects",
    "createProject",
    "getProject",
    "updateProject",
    "archiveProject",
    "listGoals",
    "createGoal",
    "getGoal",
    "updateGoal",
    "archiveGoal",
    "listTaskTypes",
    "createTaskType",
    "updateTaskType",
    "getGoalGraph",
    "listEpics",
    "createEpic",
    "getEpic",
    "updateEpic",
    "archiveEpic",
    "acceptEpic",
    "blockEpic",
    "unblockEpic",
    "cancelEpic",
    "completeEpic",
    "getEpicGraph",
    "listTasks",
    "createTask",
    "getTask",
    "updateTask",
    "archiveTask",
    "acceptTask",
    "blockTask",
    "unblockTask",
    "cancelTask",
    "waiveTask",
    "listDependencies",
    "createDependency",
    "deleteDependency",
    "listWork",
    "getTaskContext",
    "claimTask",
    "listClaims",
    "renewClaim",
    "releaseClaim",
    "reportClaim",
    "listTaskSessions",
]
prune_models = true

[server.validation]
enabled = true
max_body_bytes = 2097152
max_errors = 16
