[generator]
spec_path = "../../openapi/shepherd.yaml"
output_dir = "src/generated"
module_name = "shepherd"

[features]
enable_async_client = false

[generator.types]
date_time = "chrono"
uuid = "uuid"

[server]
framework = "axum"
operations = [
    # System — the health-only scaffold contract (v1 step 000). Later steps
    # widen this allowlist as their operations land.
    "getHealth",
]
prune_models = true

[server.validation]
enabled = true
max_body_bytes = 2097152
max_errors = 16
