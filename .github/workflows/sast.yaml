name: SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan
        env:
          # Pin semgrep by image digest rather than installing via pipx: one
          # digest covers the entire stack (Python runtime + semgrep + all
          # transitive deps) so nothing can be substituted without the digest
          # changing. Mirrors the SHA-pinning we already apply to every
          # GitHub Action in these workflows.
          #
          # Upgrading: resolve the new tag to an arm64 digest and replace both
          # the tag comment and the digest below.
          #   semgrep/semgrep:1.176.1 (linux/arm64)
          SEMGREP_IMAGE: semgrep/semgrep@sha256:35887b09ae583b36a052e2f2bb66ee17d9212151ca0945c1c9776f89df0e838f
        run: |
          # `--sarif-output=...` is written BEFORE `--error` evaluates exit
          # status, so the file always exists on both pass and fail runs —
          # paired with `if: always()` on the upload step below, we retain
          # the machine-readable record of every scan regardless of outcome.
          # We do NOT ship this SARIF to GitHub code scanning because the
          # upload-sarif action requires GitHub Advanced Security, which is
          # a paid feature for private repos. The artifact is the audit
          # trail; pull it from the run page when triaging.
          # Security packs (rust/js/ts/owasp) plus code-quality packs
          # (best-practices). Two rules are excluded, both from the
          # code-quality packs:
          # - jsx-not-internationalized: shepherd's v1 UI is a local,
          #   English-only tool — no i18n planned.
          # - react-props-spreading: the UI forwards rest props on wrapper
          #   components (Button, FormField, tabProps) — the standard React
          #   wrapper pattern, not an injection risk.
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --error \
              --sarif-output=semgrep.sarif \
              --config p/rust \
              --config p/javascript \
              --config p/typescript \
              --config p/owasp-top-ten \
              --config p/r2c-best-practices \
              --config p/react-best-practices \
              --exclude-rule typescript.react.portability.i18next.jsx-not-internationalized.jsx-not-internationalized \
              --exclude-rule typescript.react.best-practice.react-props-spreading.react-props-spreading

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
