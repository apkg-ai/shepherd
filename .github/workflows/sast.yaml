name: SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan
        env:
          # Digest-pinned like every action here — one digest covers the whole image stack.
          # Upgrading: resolve the new tag to an arm64 digest, replace the tag
          # comment and the digest below.
          #   semgrep/semgrep:1.177.0 (linux/arm64)
          SEMGREP_IMAGE: semgrep/semgrep@sha256:6b46f252080393083d6b32fca1a710edde5fd8624de9af05f49250169df1cc70
        run: |
          # SARIF is written before --error sets exit status, so it exists on
          # pass and fail; the always() upload keeps it as the audit trail
          # (not code scanning — that needs paid GHAS).
          # Excluded: jsx-not-internationalized (local English-only tool) and
          # react-props-spreading (standard rest-prop wrapper pattern).
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --error \
              --sarif-output=semgrep.sarif \
              --config p/rust \
              --config p/javascript \
              --config p/typescript \
              --config p/owasp-top-ten \
              --config p/r2c-best-practices \
              --config p/react-best-practices \
              --exclude-rule typescript.react.portability.i18next.jsx-not-internationalized.jsx-not-internationalized \
              --exclude-rule typescript.react.best-practice.react-props-spreading.react-props-spreading

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
