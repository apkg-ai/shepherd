name: Quality Gates

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-lint:
    name: Core / Lint
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy)
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-workspaces: core

      - name: Format
        run: |
          cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings

  core-test:
    name: Core / Test
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-workspaces: core

      - name: Test
        run: |
          cargo test --workspace

  ui-lint:
    name: UI / Lint
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Lint
        run: |
          npm run lint

      - name: Format
        run: |
          npm run fmt:check

  ui-typecheck:
    name: UI / Typecheck
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Typecheck
        run: |
          npm run typecheck

  ui-test:
    name: UI / Test
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Test
        run: |
          npm run test

  ui-build:
    name: UI / Build
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Build
        run: |
          npm run build

  spec-lint:
    name: Spec / Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Spectral
        run: |
          npm run lint:spec

  smoke:
    name: Smoke
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-workspaces: core

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: |
          npm ci --prefer-offline --prefix ui
          npm run build --prefix ui

      # Boot → /health → spec → UI index (builds shepherd-server itself)
      - name: Smoke
        run: |
          scripts/smoke.sh
