name: Quality Gates

on:
  pull_request:
    branches:
      - main
  # Gate the squash-merge result and direct pushes — they never ran as PR jobs.
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-lint:
    name: Core / Lint
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain needs an explicit channel; parse it from rust-toolchain.toml.
      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Format
        run: |
          cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings

  core-test-unit:
    name: Core / Test (Unit)
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain needs an explicit channel; parse it from rust-toolchain.toml.
      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy, llvm-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-cargo-llvm-cov

      # Scoped to shepherd-core; the server is covered by the integration suite.
      - name: Unit Tests (Coverage)
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lib --bins \
            --ignore-filename-regex 'shepherd-server/' \
            --lcov --output-path coverage/core-unit.lcov

      - name: Doc Tests
        run: |
          cargo test --workspace --doc

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-core-unit
          path: core/coverage/core-unit.lcov

  core-test-integration:
    name: Core / Test (Integration)
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy, llvm-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-cargo-llvm-cov

      # Scoped to the server lib; main.rs is covered by smoke.
      - name: Integration Tests (Coverage)
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --test '*' \
            --ignore-filename-regex 'shepherd-core/|main\.rs|src/generated/' \
            --lcov --output-path coverage/core-integration.lcov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-core-integration
          path: core/coverage/core-integration.lcov

  ui-lint:
    name: UI / Lint
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Generate API client
        run: |
          npm run generate:api

      - name: Lint
        run: |
          npm run lint

      - name: Format
        run: |
          npm run fmt:check

  ui-typecheck:
    name: UI / Typecheck
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Generate API client
        run: |
          npm run generate:api

      - name: Typecheck
        run: |
          npm run typecheck

  ui-test-unit:
    name: UI / Test (Unit)
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Generate API client
        run: |
          npm run generate:api

      - name: Unit Tests (Coverage)
        run: |
          npm run test:unit:cov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ui-unit
          path: ui/coverage/ui-unit.lcov

  ui-build:
    name: UI / Build
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Generate API client
        run: |
          npm run generate:api

      - name: Build
        run: |
          npm run build

  spec-lint:
    name: Spec / Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Spectral (OpenAPI)
        run: |
          npm run lint:spec

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-24.04-arm
    needs:
      - core-test-unit
      - core-test-integration
      - ui-test-unit
      - test-e2e
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      # The script is dependency-free (node:fs) — system Node suffices.
      - name: Generate Reports
        run: |
          node scripts/coverage-report.mjs --dir coverage --report core --out coverage/report-core.md
          node scripts/coverage-report.mjs --dir coverage --report ui --out coverage/report-ui.md
          cat coverage/report-core.md coverage/report-ui.md

      - name: Post Sticky Comments
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pair in "shepherd-coverage-core:coverage/report-core.md" \
                      "shepherd-coverage-ui:coverage/report-ui.md"; do
            MARKER="<!-- ${pair%%:*} -->"
            FILE="${pair#*:}"
            # A failed lookup must skip this update (continue-on-error), not POST and duplicate the comment.
            COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1)
            if [ -n "${COMMENT_ID}" ]; then
              gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
                -F body=@"${FILE}"
            else
              gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
                -F body=@"${FILE}"
            fi
          done

      - name: Enforce Thresholds
        run: |
          node scripts/coverage-report.mjs --dir coverage --check

  test-smoke:
    name: Test (Smoke)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain needs an explicit channel; parse it from rust-toolchain.toml.
      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Build UI
        run: |
          npm ci --prefer-offline --prefix ui
          npm run generate:api --prefix ui
          npm run build --prefix ui

      - name: Smoke
        run: |
          scripts/smoke.sh

  core-test-contract:
    name: Core / Test (Contract)
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Contract conformance tests
        run: |
          cargo test --package shepherd-server --test api -- contract

  core-test-hurl:
    name: Core / Test (Hurl E2E)
    runs-on: ubuntu-24.04-arm
    # The hurl binary is pinned by sha256 like every other CI tool download.

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Install hurl (pinned)
        env:
          HURL_VERSION: 8.0.1
          HURL_SHA256: bc4732df4754748e9bf296aa3832ec019f798afb399f1279b72ed37b6e04525c
        run: |
          curl -fsSLo hurl.tar.gz "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          echo "${HURL_SHA256}  hurl.tar.gz" | sha256sum -c -
          tar -xzf hurl.tar.gz
          sudo cp "hurl-${HURL_VERSION}-aarch64-unknown-linux-gnu/bin/hurl" /usr/local/bin/
          hurl --version

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Hurl E2E suite
        run: |
          "$GITHUB_WORKSPACE/scripts/hurl-e2e.sh"

  core-test-fuzz:
    name: Core / Test (Fuzz)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Placeholder
        run: echo "no fuzz targets yet — cargo-fuzz is a recorded follow-up"

  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -m1 '^channel' "$GITHUB_WORKSPACE/rust-toolchain.toml" | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Generate wire types
        uses: ./.github/actions/generate-wire-types

      - name: Install Dependencies
        run: npm ci --prefer-offline --prefix ui

      - name: Generate API client
        run: npm run generate:api --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./ui/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: npx --prefix ui playwright install --with-deps chromium

      - name: Run E2E suite
        run: scripts/playwright-e2e.sh
        env:
          E2E_COVERAGE: "1"

      - name: Upload Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-e2e
          path: ui/coverage/e2e.lcov

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: ui/e2e-artifacts/test-results
          retention-days: 7
