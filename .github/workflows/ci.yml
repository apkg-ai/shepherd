name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup picks up rust-toolchain.toml (1.98.0 + rustfmt + clippy)
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: core
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: npm ci (root + ui)
        run: |
          npm ci
          npm ci --prefix ui
      - name: oxlint
        run: npm run lint --prefix ui
      - name: oxfmt check
        run: npm run fmt:check --prefix ui
      - name: tsc
        run: npm run typecheck --prefix ui
      - name: Spectral
        run: npm run lint:spec

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo test
        run: cargo test --workspace
        working-directory: core
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci --prefix ui
      - name: vitest
        run: npm run test --prefix ui

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      - name: Smoke check
        run: scripts/smoke.sh
