name: Dependency Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OSV Scan
        env:
          OSV_VERSION: 2.5.1
          OSV_SHA256: 3d0f5aa5a6baa8eb32bcef247388e149ef6030a6634ccae6fa0d62681fb27a6d
        run: |
          set -euo pipefail
          curl -sSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_arm64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner \
            --config=osv-scanner.toml \
            --lockfile=package-lock.json \
            --lockfile=ui/package-lock.json \
            --lockfile=core/Cargo.lock

  audit-npm:
    name: Audit (npm)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # npm audit reads the lockfiles — no install needed. Zero-tolerance
      # --audit-level=low is deliberate (house posture; OSV and cargo-audit
      # are equally strict).
      - name: Audit
        run: |
          npm audit --audit-level=low
          npm audit --audit-level=low --prefix ui

  audit-cargo:
    name: Audit (cargo)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd
        run: |
          set -euo pipefail
          curl -sSLo cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-aarch64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum -c -
          tar -xzf cargo-audit.tgz --strip-components=1 "cargo-audit-aarch64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}/cargo-audit"
          ./cargo-audit audit --file core/Cargo.lock --config audit.toml
